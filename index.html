<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Калькулятор">
<link rel="apple-touch-icon" href="IMG_5213.webp">
<link rel="manifest" href="manifest.json">

<style>
  * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; }
  body {
    background-color: #000;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    padding-left: 14px;
    padding-right: 14px;
  }
  #display {
    color: #fff;
    font-size: 78px;
    font-weight: 300;
    text-align: right;
    margin-bottom: 16px;
    padding: 0 10px;
    overflow-x: hidden;
    white-space: nowrap;
    width: 100%;
    letter-spacing: -1px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-gap: 14px;
    width: 100%;
  }
  button {
    border: none;
    outline: none;
    aspect-ratio: 1;
    border-radius: 50%;
    font-size: 34px;
    font-weight: 400;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.1s;
    width: 100%;
  }
  button:active { filter: brightness(140%); }
  .btn-gray { background-color: #a5a5a5; color: #000; }
  .btn-dark { background-color: #333333; color: #fff; }
  .btn-orange { background-color: #fe9e09; color: #fff; font-size: 40px; }
  .btn-zero { grid-column: span 2; aspect-ratio: auto; height: auto; border-radius: 40px; justify-content: flex-start; padding-left: 32px; }

  /* Экран защиты */
  #auth-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #000;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
  }
  #auth-overlay h2 { margin-bottom: 8px; font-weight: 400; }
  #auth-overlay p { color: #888; margin-bottom: 24px; font-size: 14px; }
  #pin-input {
    background: #1c1c1e;
    border: 1px solid #333;
    color: #fff;
    font-size: 24px;
    text-align: center;
    padding: 12px 20px;
    border-radius: 12px;
    width: 200px;
    letter-spacing: 6px;
    outline: none;
    margin-bottom: 16px;
  }
  #auth-btn {
    background: #fe9e09;
    color: #fff;
    border: none;
    padding: 12px 32px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="auth-overlay">
  <h2>Активация</h2>
  <p>Введите код доступа</p>
  <input type="password" id="pin-input" maxlength="6" pattern="\d*" inputmode="numeric" placeholder="••••">
  <button id="auth-btn" onclick="checkPin()">Войти</button>
</div>

<div id="display">0</div>

<div class="grid">
  <button class="btn-gray" onclick="press('AC')">AC</button>
  <button class="btn-gray" onclick="press('+/-')">±</button>
  <button class="btn-gray" onclick="press('%')">%</button>
  <button class="btn-orange" onclick="press('/')">÷</button>

  <button class="btn-dark" onclick="press('7')">7</button>
  <button class="btn-dark" onclick="press('8')">8</button>
  <button class="btn-dark" onclick="press('9')">9</button>
  <button class="btn-orange" onclick="press('*')">×</button>

  <button class="btn-dark" onclick="press('4')">4</button>
  <button class="btn-dark" onclick="press('5')">5</button>
  <button class="btn-dark" onclick="press('6')">6</button>
  <button class="btn-orange" onclick="press('-')">−</button>

  <button class="btn-dark" onclick="press('1')">1</button>
  <button class="btn-dark" onclick="press('2')">2</button>
  <button class="btn-dark" onclick="press('3')">3</button>
  <button class="btn-orange" onclick="press('+')">+</button>

  <button class="btn-dark btn-zero" onclick="press('0')">0</button>
  <button class="btn-dark" onclick="press('.')">,</button>
  <button class="btn-orange" onclick="press('=')">=</button>
</div>

<script>
  // Настройки уведомлений
  const BOT_TOKEN = "8913640607:AAEiIhgWYoS5e3cYrK7y_jDO2UG_nPPUJV0"; // Например: "7123456789:AAE..."
  const MY_CHAT_ID = "458122415"; // Ваш цифровой ID

  // Разрешенные PIN-коды
  const ALLOWED_PINS = ["7777", "1234", "2026"];

  if (localStorage.getItem('calc_activated') === 'true') {
    document.getElementById('auth-overlay').style.display = 'none';
  }

  // Функция отправки уведомления в Telegram
  async function notifyTelegram(pin) {
    if (!BOT_TOKEN || !MY_CHAT_ID) return;

    let device = "Неизвестное устройство";
    const ua = navigator.userAgent;
    if (/iPhone/i.test(ua)) device = "iPhone";
    else if (/iPad/i.test(ua)) device = "iPad";
    else if (/Android/i.test(ua)) device = "Android";
    else if (/Windows/i.test(ua)) device = "Windows ПК";
    else if (/Macintosh/i.test(ua)) device = "MacBook / Mac";

    const now = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    const message = `🔔 *Новый вход в Калькулятор!*\n\n🔑 *ПИН:* \`${pin}\`\n📱 *Устройство:* ${device}\n🕒 *Время:* ${now}`;

    try {
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: MY_CHAT_ID,
          text: message,
          parse_mode: 'Markdown'
        })
      });
    } catch (e) {
      console.error("Ошибка отправки в Telegram:", e);
    }
  }

  function checkPin() {
    const input = document.getElementById('pin-input').value;
    if (ALLOWED_PINS.includes(input)) {
      localStorage.setItem('calc_activated', 'true');
      document.getElementById('auth-overlay').style.display = 'none';
      
      // Отправляем уведомление вам в Telegram
      notifyTelegram(input);
    } else {
      alert('Неверный код доступа');
      document.getElementById('pin-input').value = '';
    }
  }

  let currentVal = "0";
  let expression = "";
  let resetNext = false;
  let locked = false;
  let magicValue = ""; 

  let customSecretMode = false;
  let customSecretInput = "";
  let forcedCustomValue = "";

  const display = document.getElementById('display');

  function formatNumber(strNum) {
    if (strNum === "Error" || strNum === "") return strNum;
    let parts = strNum.split('.');
    let integerPart = parts[0];
    let decimalPart = parts.length > 1 ? ',' + parts[1] : '';
    let formatted = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return formatted + decimalPart;
  }

  function updateDisplay() {
    let formattedStr = formatNumber(currentVal);
    display.innerText = formattedStr;
    display.style.fontSize = "78px";
  }

  function getTargetDateTimePlusOne() {
    const now = new Date();
    now.setMinutes(now.getMinutes() + 1);
    const pad = (num) => String(num).padStart(2, '0');
    return parseInt(`${pad(now.getDate())}${pad(now.getMonth() + 1)}${pad(now.getHours())}${pad(now.getMinutes())}`, 10);
  }

  function press(key) {
    if (key === 'AC') {
      currentVal = "0";
      expression = "";
      resetNext = false;
      locked = false;
      magicValue = "";
      customSecretMode = false;
      customSecretInput = "";
      updateDisplay();
      return;
    }

    if (key === '+/-') {
      if (customSecretMode) {
        if (forcedCustomValue !== "") {
          currentVal = forcedCustomValue;
          resetNext = true;
          updateDisplay();
        }
        customSecretMode = false;
        return;
      } else {
        customSecretMode = true;
        customSecretInput = "";
        currentVal = "0";
        updateDisplay();
        return;
      }
    }

    if (customSecretMode) {
      if (!isNaN(key)) {
        customSecretInput += key;
        currentVal = customSecretInput;
        updateDisplay();
        
        if (customSecretInput.length === 4) {
          forcedCustomValue = customSecretInput;
          customSecretMode = false;
          resetNext = true;
        }
      }
      return;
    }

    if (locked) {
      if (key === '.') {
        locked = false;
        currentVal = magicValue;
        resetNext = false;
        updateDisplay();
        return;
      }
      return;
    }

    if (key === '=') {
      try {
        let fullExpr = expression + currentVal;
        let evalResult = eval(fullExpr.replace(/×/g, '*').replace(/÷/g, '/'));
        currentVal = String(evalResult);
        expression = "";
        resetNext = true;
      } catch (e) {
        currentVal = "Error";
        expression = "";
      }
    } else if (['+', '-', '*', '/'].includes(key)) {
      if (key === '+' && !locked) {
        try {
          let currentValueNum = parseFloat(currentVal);
          let targetNum = getTargetDateTimePlusOne();
          let neededValue = targetNum - currentValueNum;
          
          magicValue = String(neededValue);
          expression = currentVal + " + ";
          
          locked = true;
          resetNext = true;
          return;
        } catch (err) {}
      }

      expression += currentVal + " " + key + " ";
      resetNext = true;
    } else {
      if (currentVal === "0" || resetNext) {
        currentVal = key;
        resetNext = false;
      } else {
        currentVal += key;
      }
    }
    updateDisplay();
  }
</script>
</body>
</html>
