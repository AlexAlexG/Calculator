<!DOCTYPE html>
<html lang="ru">
<head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Калькулятор">
<link rel="apple-touch-icon" href="IMG_5213.webp">
<link rel="manifest" href="manifest.json">

<style>
  * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; }
  body {
    background-color: #000;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    padding-left: 14px;
    padding-right: 14px;
  }
  #display {
    color: #fff;
    font-size: 78px;
    font-weight: 300;
    text-align: right;
    margin-bottom: 16px;
    padding: 0 10px;
    overflow-x: hidden;
    white-space: nowrap;
    width: 100%;
    letter-spacing: -1px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-gap: 14px;
    width: 100%;
  }
  button {
    border: none;
    outline: none;
    aspect-ratio: 1;
    border-radius: 50%;
    font-size: 34px;
    font-weight: 400;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.1s;
    width: 100%;
  }
  button:active { filter: brightness(140%); }
  .btn-gray { background-color: #a5a5a5; color: #000; }
  .btn-dark { background-color: #333333; color: #fff; }
  .btn-orange { background-color: #fe9e09; color: #fff; font-size: 40px; }
  .btn-zero { grid-column: span 2; aspect-ratio: auto; height: auto; border-radius: 40px; justify-content: flex-start; padding-left: 32px; }
</style>
</head>
<body>

<div id="display">0</div>

<div class="grid">
  <button class="btn-gray" onclick="press('AC')">AC</button>
  <button class="btn-gray" onclick="press('+/-')">±</button>
  <button class="btn-gray" onclick="press('%')">%</button>
  <button class="btn-orange" onclick="press('/')">÷</button>

  <button class="btn-dark" onclick="press('7')">7</button>
  <button class="btn-dark" onclick="press('8')">8</button>
  <button class="btn-dark" onclick="press('9')">9</button>
  <button class="btn-orange" onclick="press('*')">×</button>

  <button class="btn-dark" onclick="press('4')">4</button>
  <button class="btn-dark" onclick="press('5')">5</button>
  <button class="btn-dark" onclick="press('6')">6</button>
  <button class="btn-orange" onclick="press('-')">−</button>

  <button class="btn-dark" onclick="press('1')">1</button>
  <button class="btn-dark" onclick="press('2')">2</button>
  <button class="btn-dark" onclick="press('3')">3</button>
  <button class="btn-orange" onclick="press('+')">+</button>

  <button class="btn-dark btn-zero" onclick="press('0')">0</button>
  <button class="btn-dark" onclick="press('.')">,</button>
  <button class="btn-orange" onclick="press('=')">=</button>
</div>

<script>
    
    // Инициализация Telegram Mini App
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  if (tg.requestFullscreen) {
    tg.requestFullscreen();
  }

  tg.setHeaderColor('#000000');
  tg.setBackgroundColor('#000000');

  // Получаем Telegram ID пользователя и приводим к числу
  const user = tg.initDataUnsafe?.user;
  const userId = user ? Number(user.id) : null;

  // БЕЛЫЙ СПИСОК (укажите ваш ID без кавычек)
  const allowedUserIds = [
    458122415// Убедитесь, что здесь стоят только цифры
  ];

  // Проверка доступа с приведением к Number
  const isAllowed = userId && allowedUserIds.map(Number).includes(userId);

  if (!isAllowed) {
    document.body.innerHTML = `
      <div style="color: #fff; text-align: center; padding-top: 50vh; transform: translateY(-50%); font-family: sans-serif; padding: 20px;">
        <h2>Доступ ограничен</h2>
        <p style="color: #aaa; margin-top: 10px;">У вас нет прав для использования приложения.</p>
        <p style="color: #fe9e09; font-size: 16px; font-weight: bold; margin-top: 20px;">
          Ваш полученный ID: ${userId ? userId : 'Не определен (открыто вне Telegram)'}
        </p>
      </div>
    `;
    throw new Error("Access Denied");
  }



  let currentVal = "0";
  let expression = "";
  let resetNext = false;
  let locked = false;
  let magicValue = ""; 

  // Состояния для второго фокуса (ввод 4 цифр через ±)
  let customSecretMode = false;
  let customSecretInput = "";
  let forcedCustomValue = "";

  const display = document.getElementById('display');

  function formatNumber(strNum) {
    if (strNum === "Error" || strNum === "") return strNum;
    let parts = strNum.split('.');
    let integerPart = parts[0];
    let decimalPart = parts.length > 1 ? ',' + parts[1] : '';
    let formatted = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return formatted + decimalPart;
  }

  function updateDisplay() {
    let formattedStr = formatNumber(currentVal);
    display.innerText = formattedStr;
    display.style.fontSize = "78px";
  }

  function getTargetDateTimePlusOne() {
    const now = new Date();
    now.setMinutes(now.getMinutes() + 1);
    const pad = (num) => String(num).padStart(2, '0');
    return parseInt(`${pad(now.getDate())}${pad(now.getMonth() + 1)}${pad(now.getHours())}${pad(now.getMinutes())}`, 10);
  }

  function press(key) {
    // Сброс
    if (key === 'AC') {
      currentVal = "0";
      expression = "";
      resetNext = false;
      locked = false;
      magicValue = "";
      customSecretMode = false;
      customSecretInput = "";
      updateDisplay();
      return;
    }

    // ТРИГГЕР ВТОРОГО ФОКУСА (Клавиша ±)
    if (key === '+/-') {
      if (customSecretMode) {
        if (forcedCustomValue !== "") {
          currentVal = forcedCustomValue;
          resetNext = true;
          updateDisplay();
        }
        customSecretMode = false;
        return;
      } else {
        customSecretMode = true;
        customSecretInput = "";
        currentVal = "0";
        updateDisplay();
        return;
      }
    }

    // Если активен режим ввода секретных 4 цифр
    if (customSecretMode) {
      if (!isNaN(key)) {
        customSecretInput += key;
        currentVal = customSecretInput;
        updateDisplay();
        
        if (customSecretInput.length === 4) {
          forcedCustomValue = customSecretInput;
          customSecretMode = false;
          resetNext = true;
        }
      }
      return;
    }

    // РЕЖИМ БЛОКИРОВКИ ПЕРВОГО ФОКУСА (Дата/время)
    if (locked) {
      if (key === '.') {
        locked = false;
        currentVal = magicValue;
        resetNext = false;
        updateDisplay();
        return;
      }
      return;
    }

    // Обычные вычисления
    if (key === '=') {
      try {
        let fullExpr = expression + currentVal;
        let evalResult = eval(fullExpr.replace(/×/g, '*').replace(/÷/g, '/'));
        currentVal = String(evalResult);
        expression = "";
        resetNext = true;
      } catch (e) {
        currentVal = "Error";
        expression = "";
      }
    } else if (['+', '-', '*', '/'].includes(key)) {
      if (key === '+' && !locked) {
        try {
          let currentValueNum = parseFloat(currentVal);
          let targetNum = getTargetDateTimePlusOne();
          let neededValue = targetNum - currentValueNum;
          
          magicValue = String(neededValue);
          expression = currentVal + " + ";
          
          locked = true;
          resetNext = true;
          return;
        } catch (err) {}
      }

      expression += currentVal + " " + key + " ";
      resetNext = true;
    } else {
      if (currentVal === "0" || resetNext) {
        currentVal = key;
        resetNext = false;
      } else {
        currentVal += key;
      }
    }
    updateDisplay();
  }
</script>
</body>
</html>
